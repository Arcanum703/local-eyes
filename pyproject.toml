[project]
name = "local-eyes"
version = "0.1.0"
description = "MCP server that gives text-only and offline AI agents eyes, powered by Gemma 4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2",
    "httpx>=0.27",
    "pillow>=10",
    "python-dotenv>=1",
]

[project.scripts]
local-eyes = "local_eyes.server:main"
local-eyes-cli = "local_eyes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
